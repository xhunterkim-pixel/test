<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom Trader Creator</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="bg"></div>

  <header id="top">
    <div class="logo" data-act="home" title="Start menu (Ctrl+M)"><div>Custom Trader Creator</div><div class="credit"><span id="appVersion">v1.0.0</span> · discord : k_kyangg</div></div>
    <div class="search-pill">
      <span class="ico">📁</span>
      <span id="folder" class="folder">Pick your SPT_Runtime\user\mods\CustomTraders folder</span>
      <button class="ghost" data-act="reload">Reload</button>
      <button class="ghost" data-act="browse">Browse…</button>
    </div>
    <div class="top-right">
      <span id="itemsStatus" class="muted small"></span>
      <button class="ghost" data-act="home" title="All traders (Ctrl+M)">⌂ Menu</button>
      <button class="ghost" data-act="shortcuts" title="Keyboard shortcuts (F1)">⌨ Shortcuts</button>
      <button class="outline" data-act="appearance">Appearance</button>
      <button class="outline" id="checksButton" data-act="page" data-arg="checks">Checks</button>
    </div>
  </header>

  <main id="main">
    <aside id="left" class="panel">
      <nav id="nav">
        <button class="nav" data-act="page" data-arg="trader"><svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.3-8 5.2V21h16v-1.8c0-2.9-3.6-5.2-8-5.2Z"/></svg><span>Trader</span><em id="navTrader"></em></button>
        <button class="nav" data-act="page" data-arg="offers"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.4 12.2A2 2 0 0 1 16.6 21H7.4a2 2 0 0 1-2-1.8L4 7Zm4 0a4 4 0 1 1 8 0h-2a2 2 0 1 0-4 0H8Z"/></svg><span>Offers &amp; Barters</span><em id="navOffers"></em></button>
        <button class="nav" data-act="page" data-arg="quests"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm2 9v2h8v-2H8Zm0 4v2h6v-2H8Zm6-11v4h4l-4-4Z"/></svg><span>Quests</span><em id="navQuests"></em></button>
        <button class="nav" data-act="page" data-arg="mods"><svg viewBox="0 0 24 24"><path d="M10 2a2.5 2.5 0 0 1 2.5 2.5V5H17a2 2 0 0 1 2 2v4.5h.5a2.5 2.5 0 0 1 0 5H19V21a1 1 0 0 1-1 1h-4.5v-1a2 2 0 1 0-4 0v1H5a1 1 0 0 1-1-1v-4.5h1a2 2 0 1 0 0-4H4V7a2 2 0 0 1 2-2h1.5v-.5A2.5 2.5 0 0 1 10 2Z"/></svg><span>Mods</span><em id="navMods"></em></button>
        <button class="nav" data-act="page" data-arg="checks"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-1.2 13.6 6.3-6.3-1.4-1.4-4.9 4.9-2.3-2.3-1.4 1.4 3.7 3.7Z"/></svg><span>Checks &amp; Log</span><em id="navChecks"></em></button>
      </nav>
      <div class="grow"></div>
      <div id="traderMenu" hidden>
        <div class="menu-title">All Traders</div>
        <div id="traders" class="scroll"></div>
        <button class="menu-add" data-act="newTrader">＋ New Trader</button>
        <button class="menu-add" id="trashBtn" data-act="deletedTraders">🗑  Deleted Traders</button>
      </div>
      <div id="me" data-act="toggleTraders" title="Show all traders (right-click for more)"></div>
    </aside>

    <div class="splitter" id="splitLeft" title="Drag to resize · double-click to reset"></div>

    <section id="center" class="panel">
      <div id="header">
        <img id="headerAvatar" alt="">
        <div class="header-text">
          <div id="headerKind" class="kind">TRADER</div>
          <h1 id="headerTitle">No trader</h1>
          <div id="headerSub" class="muted"></div>
        </div>
      </div>
      <nav id="chips">
        <div id="searchBox" class="search" title="Search (Ctrl+F)"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 6 12l4.7 4.7-1.4 1.4-4.7-4.7A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
          <input type="text" id="search" placeholder="Search" spellcheck="false"><button class="icon-btn" id="searchClear" data-act="clearSearch" title="Clear">✕</button></div>
        <button class="view-btn" data-act="viewMenu" title="Sort, columns and what's shown"><span id="viewLabel">View</span><svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5Zm4 0h14v2H7V5ZM3 11h2v2H3v-2Zm4 0h14v2H7v-2Zm-4 6h2v2H3v-2Zm4 0h14v2H7v-2Z"/></svg></button>
      </nav>
      <div id="page" class="scroll"></div>
    </section>

    <div class="splitter" id="splitter" title="Drag to resize · double-click to reset"></div>

    <aside id="right" class="panel">
      <h2 id="detailsTitle"></h2>
      <div id="details" class="scroll"></div>
    </aside>
  </main>

  <section id="home" hidden>
    <div class="home-inner">
      <div class="home-head"><h1>Your Traders</h1><span class="muted" id="homeSub"></span></div>
      <div id="homeGrid"></div>
      <div class="home-foot muted small">Custom Trader Creator <span id="homeVersion"></span> · made by discord : k_kyangg</div>
    </div>
  </section>

  <footer id="bottom">
    <div id="status" class="muted"></div>
    <div id="checkSummary" data-act="page" data-arg="checks"></div>
    <div id="unsaved"></div>
    <div class="undo-group">
      <button class="icon-btn big-icon" id="undoBtn" data-act="undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="icon-btn big-icon" id="redoBtn" data-act="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    </div>
    <button class="primary big" data-act="save">Save All</button>
  </footer>

  <div id="modal" hidden></div>
  <div id="toast"></div>

  <script>
    // Outside the editor (plain browser) a test double of the host is used.
    if (!(window.chrome && window.chrome.webview)) document.write('<script src="dev-mock.js"><\/script>');
  </script>
  <script src="app.js"></script>
</body>
</html>
